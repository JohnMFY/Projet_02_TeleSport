<div class="header">
<h2 class="header-title">Olympic games app</h2>
<hr/>
    <img
        *ngIf="imageSrc"
        [src]="imageSrc"
        [alt]="imageAlt"
        class="header-image"
        [ngClass]="imageClass"
    >
  <div class="center">
    <div>{{ title }}</div>
  </div>

  <div class="split">
    <div *ngFor="let header of headers">
      <p>{{ header.label }}</p>
      <p>{{ header.value }}</p>
    </div>
  </div>

</div>
