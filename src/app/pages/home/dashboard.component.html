<h2>Olympic games app</h2>
<hr/>
<div>
  <div class="wrapper-container">
    <app-header
      [title]="titlePage"
      [headers]="headerData"
      imageSrc="assets/images/teleSport.png"
      imageAlt="">
    </app-header>
  </div>
  <app-bar-chart
    *ngIf="countries.length > 0"
    [labels]="countries"
    [values]="sumOfAllMedalsYears">
  </app-bar-chart>
</div>
