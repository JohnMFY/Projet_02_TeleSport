<div>
  <div class="wrapper-container">
    <app-header
      [title]="titlePage"
      [headers]="headerData"
      imageSrc="assets/images/teleSport.png"
      imageAlt="">
    </app-header>
  </div>
  <p *ngIf="isLoading" class="loader">Loading...</p>
  <p *ngIf="error" class="error-message">{{ error }}</p>
  <app-bar-chart
    *ngIf="countries.length > 0"
    [labels]="countries"
    [values]="sumOfAllMedalsYears"
    (barClicked)="onCountryClick($event)">
  </app-bar-chart>
</div>
